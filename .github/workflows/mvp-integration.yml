name: MVP integration

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      MODEL_PROVIDER: demo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            frontend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate committed data
        run: python -m scripts.mvp check
      - name: Pipeline regression tests
        run: python -m unittest discover -s tests -v
      - name: Backend regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: HTTP and Streamlit integration
        run: python -m scripts.mvp verify
      - name: D1/D2 HTTP fixture and UI handoff
        run: python -m scripts.mvp verify-week2
