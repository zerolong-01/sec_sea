name: MVP integration

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MODEL_PROVIDER: demo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            backend/requirements.txt
            frontend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Validate committed data
        run: |
          python -m scripts.mvp check
          python -m scripts.week2_data check
          python -m scripts.week3_data check
      - name: Pipeline regression tests
        run: python -m unittest discover -s tests -v
      - name: Week-four report tables match backend AI evidence
        run: python -m scripts.week4_report_comparison --check-docs --output runs/week4-report-comparison-ci
      - name: Backend regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: HTTP and Streamlit integration
        run: python -m scripts.mvp verify
      - name: D1/D2 HTTP fixture and UI handoff
        run: python -m scripts.mvp verify-week2
      - name: Week-two data, evaluator and target-gold handoff
        run: python -m scripts.week2_data verify-handoff --output runs/week2-data-ci
      - name: Week-three two-app batch, resume and report handoff
        run: python -m scripts.verify_week3 --output runs/week3-batch-ci
      - name: Week-four immutable replay and evaluation-source contract
        run: python -m scripts.verify_week4 --fixture-output runs/week3-batch-ci --output runs/week4-package-ci
      - name: Multi-model CLI, shared detector and comparison exports
        run: python -m scripts.verify_model_experiment --output runs/model-experiment-ci
